# Main entity for membership levels
type MembershipLevel @entity(immutable: false) {
  id: Bytes!
  levelIndex: BigInt! # uint256
  name: String! # string
  threshold: BigInt! # uint256
  membershipTokenURI: String! # string
  rewardBasisPoints: BigInt! # uint256
  isActive: Boolean! # Track if level is active
  totalMembers: BigInt! # Track total members in this level
  members: [MembershipNFT!]! @derivedFrom(field: "level")
  createdAt: BigInt!
  updatedAt: BigInt
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Main entity for membership NFTs
type MembershipNFT @entity(immutable: false) {
  id: Bytes!
  tokenId: BigInt! # uint256
  owner: Bytes! # address
  level: MembershipLevel!
  expiryDate: BigInt! # uint256
  isActive: Boolean! # Track if membership is active
  lastActivityTime: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  transferHistory: [MembershipTransferred!]! @derivedFrom(field: "membershipNFT")
  renewalHistory: [MembershipRenewed!]! @derivedFrom(field: "membershipNFT")
  metadata: MembershipMetadata @derivedFrom(field: "membershipNFT")
}

