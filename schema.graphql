  bids: [Bid!]! @derivedFrom(field: "auction")

  # Metadata
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!

  # Add ticket reference
  ticket: NewTicketStatus!
}

