specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ICHICHAIN
    network: matic
    source:
      address: "0x8386b1F2cd830907E5B4AdC30eA45515B17b80b4"
      abi: ICHICHAIN
      startBlock: 59036305
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Approval
        - ApprovalForAll
        - ConsecutiveTransfer
        - LastPrizeDraw
        - LastPrizeWinner
        - NewSeries
        - NewSubPrize
        - NewTicketStatus
        - OwnershipTransferred
        - RefundSeries
        - Transfer
        - UpdatePrize
        - UpdateSeriesInformation
        - UpdateSeriesLastPrizeOwner
        - UpdateSeriesRemainingTicketNumbers
        - UpdateTicketStatus
      abis:
        - name: ICHICHAIN
          file: ./abis/ICHICHAIN.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
        - event: ConsecutiveTransfer(indexed uint256,uint256,indexed address,indexed address)
          handler: handleConsecutiveTransfer
        - event: LastPrizeDraw(uint256,uint256,uint256)
          handler: handleLastPrizeDraw
        - event: LastPrizeWinner(uint256,uint256[])
          handler: handleLastPrizeWinner
        - event: NewSeries(indexed
            uint256,string,uint256,uint256,uint256,uint256,bool,uint256,uint256,string,string,string,string,address,bool,bool)
          handler: handleNewSeries
        - event: RefundSeries(indexed uint256,bool)
          handler: handleRefundSeries
        - event: ResetSubPrize(indexed uint256)
          handler: handleResetSubPrize
        - event: NewSubPrize(indexed uint256,uint256,string,string,uint256)
          handler: handleNewSubPrize
        - event: NewTicketStatus(uint256,uint256,uint256,bool,bool,address)
          handler: handleNewTicketStatus
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: UpdatePrize(indexed uint256,uint256,uint256)
          handler: handleUpdatePrize
        - event: UpdateSeriesInformation(indexed
            uint256,bool,uint256,uint256,string,string,string,string)
          handler: handleUpdateSeriesInformation
        - event: UpdateSeriesLastPrizeOwner(indexed uint256,address[])
          handler: handleUpdateSeriesLastPrizeOwner
        - event: UpdateSeriesRemainingTicketNumbers(indexed uint256,uint256)
          handler: handleUpdateSeriesRemainingTicketNumbers
        - event: UpdateTicketStatus(uint256,uint256,uint256,bool,bool)
          handler: handleUpdateTicketStatus
      file: ./src/ichichain.ts
  - kind: ethereum
    name: RevealOnChainData
    network: matic
    source:
      address: "0x8386b1F2cd830907E5B4AdC30eA45515B17b80b4"
      abi: ICHICHAIN
      startBlock: 59036305
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RevealDrawFulfilled
        - RevealDrawSent
        - RevealVRFRequest
        - RevealVRFTokenResult
        - RevealVRFPrizeDistribution
      abis:
        - name: ICHICHAIN
          file: ./abis/ICHICHAIN.json
      eventHandlers:
        - event: RevealDrawFulfilled(uint256,uint256,uint256[])
          handler: handleRevealDrawFulfilled
        - event: RevealDrawSent(uint256,uint256[])
          handler: handleRevealDrawSent
      file: ./src/onChainData.ts
  - kind: ethereum
    name: Contract
    network: matic
    source:
      address: "0x25B983DD08C9F534D3cda1289DD2B0047732c06B"
      abi: Contract
      startBlock: 64961334	
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ContractApproval
        - ContractApprovalForAll
        - MembershipExpired
        - MembershipLevelCreated
        - MembershipLevelUpdated
        - MembershipNFTBurned
        - MembershipNFTMinted
        - MembershipRenewed
        - MembershipTransferred
        - MembershipUpgraded
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - ContractTransfer
        - VoucherMinted
        - VoucherTotalRedeemed
        - VoucherTransferred
        - VoucherTypeCreated
        - VoucherTypeUpdated
        - VouchersIssuedFromSubscription
      abis:
        - name: Contract
          file: ./abis/Contract.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
        - event: MembershipExpired(address,uint256)
          handler: handleMembershipExpired
        - event: MembershipLevelCreated(uint256,string,uint256,string,uint256)
          handler: handleMembershipLevelCreated
        - event: MembershipLevelUpdated(uint256,uint256,string,uint256)
          handler: handleMembershipLevelUpdated
        - event: MembershipNFTBurned(address,uint256)
          handler: handleMembershipNFTBurned
        - event: MembershipRenewed(address,uint256,uint256)
          handler: handleMembershipRenewed
        - event: MembershipTransferred(address,address,uint256,string)
          handler: handleMembershipTransferred
        - event: MembershipUpgraded(address,uint256,uint256,string)
          handler: handleMembershipUpgraded
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: VoucherMinted(uint256,address,uint256)
          handler: handleVoucherMinted
        - event: VoucherTotalRedeemed(uint256[],address,uint256,uint256)
          handler: handleVoucherTotalRedeemed
        - event: VoucherTransferred(address,address,uint256)
          handler: handleVoucherTransferred
        - event: VoucherTypeCreated(uint256,uint256,uint256,string)
          handler: handleVoucherTypeCreated
        - event: VoucherTypeUpdated(uint256,uint256,uint256,string)
          handler: handleVoucherTypeUpdated
        - event: VouchersIssuedFromSubscription(indexed address,uint256[],uint256[],uint256)
          handler: handleVouchersIssuedFromSubscription
      file: ./src/contract.ts
templates:
  - kind: file/ipfs
    name: IpfsContent
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - IchibanSeries
        - IchibanKujiPrize
        - IchibanKujiSubPrize
      abis:
        - name: Contract
          file: ./abis/ICHICHAIN.json
      handler: handleIchibanSeries
      file: ./src/ichichain.ts
  - kind: file/ipfs
    name: DoudoNFTIpfsContent
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MembershipMetadata
        - VoucherMetadata
        - VoucherMetadata
        - MembershipLevel     # Add this
        - Membership         # Add this if needed
        - Voucher   
      abis:
       - name: doudonft
         file: ./abis/Contract.json
      handler: handleDoudoNFTContent
      file: ./src/contract.ts